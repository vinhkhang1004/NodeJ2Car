version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: j2car-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: j2car

    volumes:
      - mongo-data:/data/db

    networks:
      - j2car-network

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: j2car-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/j2car
      JWT_SECRET: j2car_production_secret_key_123456

      # SMTP
      # SMTP_HOST=smtp.gmail.com
      # SMTP_PORT=587
      # SMTP_USER=your-email@gmail.com
      # SMTP_PASS=your-app-password

    depends_on:
      mongodb:
        condition: service_healthy

    volumes:
      - backend-uploads:/app/uploads

    networks:
      - j2car-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: j2car-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - j2car-network

volumes:
  mongo-data:
  backend-uploads:

networks:
  j2car-network:
    driver: bridge