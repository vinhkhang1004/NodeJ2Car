version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: j2car-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: j2car-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/j2car
      - JWT_SECRET=j2car_production_secret_key_123456
      - NODE_ENV=production
      # - SMTP_HOST=smtp.gmail.com
      # - SMTP_PORT=587
      # - SMTP_USER=your-email@gmail.com
      # - SMTP_PASS=your-app-password
    depends_on:
      - mongodb
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: j2car-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-uploads:
